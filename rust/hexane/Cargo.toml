[package]
name = "hexane"
version = "1.0.0-alpha.5"
edition = "2021"
license = "MIT"
repository = "https://github.com/automerge/automerge"
rust-version = "1.90.0"
description = "A columnar compression library used by automerge"
readme = "./README.md"

[lib]
bench = false


[features]
wasm = ["web-sys"]
slow_path_assertions = []
# Deep/expensive fuzz tests, skipped by default so `cargo test` stays fast.
deep_fuzz = []
# The bijou64 codec (src/bijou64.rs) is verified with Verus; `vstd` supplies
# the `verus!` macro, which erases all specs and proofs in a normal build.
bijou64 = ["dep:vstd"]


[dependencies]
leb128 = "^0.2.5"
thiserror = "^2.0.12"
vstd = { version = "=0.0.0-2026-10-25-0158", optional = true }

[dev-dependencies]
proptest = { version = "^1.7", default-features = false, features = ["std"] }
rand = { version = "^0.10", optional = false }
divan = "0.1.15"

[profile.release]
debug = true

[dependencies.web-sys]
version = "^0.3.55"
features = ["console"]
optional = true
