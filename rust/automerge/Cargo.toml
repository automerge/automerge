[package]
name = "automerge"
version = "0.11.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/automerge/automerge"
rust-version = "1.90.0"
description = "A JSON-like data structure (a CRDT) that can be modified concurrently by different users, and merged again automatically"
readme = "./README.md"

[features]
optree-visualisation = ["dot"]
wasm = ["js-sys", "wasm-bindgen", "web-sys", "getrandom/wasm_js", "hexane/wasm"]
utf8-indexing = []
utf16-indexing = []
# Whether to enable "slow path" assertions which check that various invariants hold
# should only be enabled when running tests
slow_path_assertions = ["hexane/slow_path_assertions"]

[dependencies]
cfg-if = "1.0"
# zlib-rs backend: pure Rust (works on wasm), ~25% faster inflate than the
# default miniz_oxide backend natively and ~2x faster on wasm
flate2 = { version = "^1.0.22", default-features = false, features = ["zlib-rs"] }
getrandom = "0.4"
hex = "^0.4.3"
hexane = { version = "1.0.0-alpha.5", path = "../hexane" }
itertools = "0.15.0"
leb128 = "^0.2.5"
rustc-hash = "^2.1.1"
serde = { version = "^1.0", features = ["derive"] }
sha2 = "^0.11.0-rc.5"
smol_str = { version = "0.3", features = ["serde"] }
thiserror = "^2.0.12"
tinyvec = { version = "^1.5.1", features = ["alloc"] }
tracing = { version = "^0.1.29" }
unicode-segmentation = "1.10.1"

# optional deps
dot = { version = "0.2.0", optional = true }
js-sys = { version = "^0.3", optional = true }
rand = { version = "^0.10", optional = false }
wasm-bindgen = { version = "^0.2", optional = true }

[dependencies.web-sys]
version = "^0.3.55"
features = ["console"]
optional = true

[dev-dependencies]
automerge-test = { path = "../automerge-test" }
maplit = { version = "^1.0" }
pretty_assertions = "1.0.0"
prettytable = "0.10.0"
proptest = { version = "^1.7.0", default-features = false, features = ["std"] }
serde_json = { version = "^1.0.73", features = ["float_roundtrip"], default-features = true }
test-log = { version = "0.2.10", features = ["trace"], default-features = false }
tracing-subscriber = { version = "^0.3", features = ["fmt", "env-filter"] }
