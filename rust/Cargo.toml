[workspace]
members = [
    "automerge-sync",
    "automerge",
    "automerge-c",
    "benchmark-battery",
    "automerge-cli",
    "automerge-test",
    "automerge-wasm",
    "edit-trace",
    "hexane",
]
resolver = "2"

[profile.release]
lto = true
codegen-units = 1

[profile.bench]
debug = true

# Optimized but keeps `debug_assert!` and overflow checks. What the
# automerge-wasm test suite builds against: a dev-profile wasm runs its
# tests ~20x slower. LTO is off and codegen-units high to keep the
# build itself quick.
[profile.wasm-test]
inherits = "release"
debug-assertions = true
overflow-checks = true
lto = false
codegen-units = 16
